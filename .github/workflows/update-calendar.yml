name: 自动更新中国休息日历

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: 获取仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 安装农历库
        run: pip install lunardate

      - name: 生成日历
        run: python generate_calendar.py

      - name: 增加节日
        run: python add-festivals.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add china-rest-days.ics

          if git diff --cached --quiet; then
            echo "日历没有变化，不提交。"
          else
            git commit -m "自动更新中国休息日日历"
            git push
          fi
